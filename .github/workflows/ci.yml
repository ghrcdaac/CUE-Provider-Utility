name: CI

on:
  push:
    branches: [main, sit, nselvaraj-desktop-gui]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: python -m pip install "poetry>=2,<3"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: black
        run: poetry run black --check cue_provider_utility tests
      - name: flake8
        run: poetry run flake8
      - name: mypy
        run: poetry run mypy cue_provider_utility
      - name: pytest
        run: poetry run pytest -q
